{% extends "base.html" %}
{% block title %}Entrar - Deposito Baratao{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login-card">
  <h2 style="margin-bottom: -4px;">Deposito Baratao</h2>
  <h2>Entrar</h2>
  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  <label>
    Email
    <input type="email" name="email" required autofocus />
  </label>
  <label>
    Senha
    <span class="password-field">
      <input type="password" name="password" id="password-input" required />
      <button type="button" class="icon-btn password-toggle" id="password-toggle" aria-label="Mostrar senha" tabindex="-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </span>
  </label>
  <button type="submit">Entrar</button>
</form>
<script>
  (function () {
    const input = document.getElementById("password-input");
    const toggle = document.getElementById("password-toggle");
    toggle.addEventListener("click", () => {
      const mostrar = input.type === "password";
      input.type = mostrar ? "text" : "password";
      toggle.setAttribute("aria-label", mostrar ? "Esconder senha" : "Mostrar senha");
      toggle.classList.toggle("active", mostrar);
    });
  })();
</script>
{% endblock %}
