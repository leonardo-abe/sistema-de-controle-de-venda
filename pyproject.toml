[project]
name = "controle-vendas"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.142.2",
    "jinja2>=3.1.6",
    "pyjwt>=2.15.1",
    "python-decouple>=3.8",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "uvicorn app.main:app --reload --port 8000"
start = "uvicorn app.main:app --port 8000"
